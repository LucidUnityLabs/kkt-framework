name: Numerical checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified tag
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, verified tag
        with:
          python-version: '3.13.5'
      - name: Require reviewed dependency lock
        run: test -s requirements.lock
      - name: Install hash-locked wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip check
      - name: Check repeated numerical builds
        run: |
          python tools/build.py --suite numerics --out build/repro-a
          python tools/build.py --suite numerics --out build/repro-b
          python tools/compare_builds.py build/repro-a build/repro-b